services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chokro
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chokro"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - chokro-postgres:/var/lib/postgresql/data

volumes:
  chokro-postgres:
