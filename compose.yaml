name: chokro

services:
  postgres:
    image: postgres:17-alpine
    command: [ "postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50" ]
    environment:
      POSTGRES_DB: chokro
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chokro" ]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'
    volumes:
      - chokro-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chokro
      JWT_SECRET: dev_jwt_secret
      QR_SECRET: dev_qr_secret
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
    restart: unless-stopped

  db-setup:
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chokro
    profiles:
      - setup
    command: sh -c "pnpm db:push && pnpm db:migrate && pnpm db:seed"

volumes:
  chokro-postgres:

