name: chokro

services:
  postgres:
    image: postgres:17-alpine
    command: [ "postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50" ]
    environment:
      POSTGRES_DB: chokro
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chokro" ]
      interval: 2s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'
    volumes:
      - chokro-postgres:/var/lib/postgresql/data

  db-setup:
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chokro
    command: sh -c "pnpm run db:setup"
    restart: "no"

  api:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chokro
      JWT_SECRET: dev_jwt_secret
      QR_SECRET: dev_qr_secret
      NODE_OPTIONS: "--max-old-space-size=512"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
    restart: unless-stopped

  notifications:
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chokro
      NOTIFY_TRANSPORT: ${NOTIFY_TRANSPORT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_CRON: ${NOTIFY_CRON:-0 9 * * *}
      NOTIFY_WINDOW_HOURS: ${NOTIFY_WINDOW_HOURS:-24}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SCHEME: ${APP_SCHEME:-chokro}
      TZ: ${TZ:-Asia/Dhaka}
    command: sh -c "pnpm --filter @chokro/api notify:schedule"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

volumes:
  chokro-postgres:
